name: Tests (Poetry + Coverage HTML)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare .env
        run: cp .env.example .env   
        
      - name: install poetry
        run: pip install -U pip poetry
        
      - name: install dependecies
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-root
          
      - name: Run tests (HTML coverage)
        run: |
          poetry run pytest --cov=src --cov-report=term-missing --disable-warnings
          #poetry run pytest --cov=src --cov-report=html:htmlcov
          #rm -rf site && mkdir -p site/coverage
          #cp -r htmlcov/* site/coverage/

      #- name: Upload Pages artifact
      #  uses: actions/upload-pages-artifact@v3
      #  with:
      #    path: site
          
      # comment for a while, need to set the repo to public
      #- name: Deploy to GitHub Pages
        #uses: actions/deploy-pages@v4
  scan:
    runs-on: ubuntu-latest
    needs: test          
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install poetry
      - run: poetry install
      - name: Install scanning tools
        run: |
          pip install ruff bandit semgrep


      - name: Ruff (lint)
        run: ruff check .

      - name: Bandit (security scan)
        run: bandit -r src || true

      - name: Semgrep (SAST)
        run: semgrep scan --config auto || true

[project]
name = "TutorNet-AI-Agent"
version = "0.1.0"
description = ""
authors = [
    {name = "Kaidi Zhang",email = "teric.zhang@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "mcp (>=1.14.0,<2.0.0)",
    "langgraph (>=0.3.27,<0.4.0)",
    "langchain (>=0.3.23,<0.4.0)",
    "langchain-core (>=0.3.51,<0.4.0)",
    "langchain-mcp-adapters (>=0.1.9,<0.2.0)",
    "langchain-anthropic (>=0.3.10,<0.4.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "asyncio (>=3.4.3,<4.0.0)",
    "fastmcp (>=2.12.3,<3.0.0)",
    "langchain-community (>=0.3.29,<0.4.0)",
    "dashscope (>=1.24.5,<2.0.0)",
    "openai (>=2.0.0,<3.0.0)",
    "aiohttp (>=3.12.15,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "httpx-sse (>=0.4.1,<0.5.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "python-json-logger (>=3.3.0,<4.0.0)",
    "opentelemetry-sdk (>=1.37.0,<2.0.0)",
    "opentelemetry-exporter-otlp (>=1.37.0,<2.0.0)",
    "opentelemetry-propagator-b3 (>=1.37.0,<2.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.58b0,<0.59)",
    "fastapi (>=0.118.0,<0.119.0)",
    "langfuse (>=3.6.1,<4.0.0)",
]

[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.scripts]
main = "src.main:main"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.2.0"
black = "^25.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"